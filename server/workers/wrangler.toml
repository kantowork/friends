name = "friends-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Cloudflare Workers Logs (Observability) 有効化設定
[observability]
enabled = true
head_sampling_rate = 1

# Secrets required:
# - FIREBASE_PROJECT_ID: e.g. "friends-kanto-prod"
# - GOOGLE_CLIENT_EMAIL: e.g. "friends-workers-backend@..."
# - GOOGLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\n..."
