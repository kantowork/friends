syntax = "proto3";

package friends.model;


option go_package = "work.kanto.friends/model;friendsmodel";
option java_multiple_files = true;
option java_package = "work.kanto.friends.model";
option swift_prefix = "Friends";

// 友達追加用招待ペイロード (QR / テキスト / クリップボード)
message FriendInvitationPayload {
  string type = 1;          // "friend_invite" 固定
  int32 version = 2;        // フォーマットバージョン (1)
  string tenant_id = 3;     // 所属テナントID (t_xxx)
  string user_id = 4;       // 公開ユーザーID (u_xxx)
  string uid = 5;           // Firebase Auth UID
  string display_name = 6;  // 表示名
  string public_key = 7;    // 端末公開鍵 (Base64)
  string passcode = 8;      // 30秒更新の3桁合言葉 (000〜999)
  int64 timestamp = 9;      // ペイロード生成エポック秒
}
