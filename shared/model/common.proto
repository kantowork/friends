syntax = "proto3";

package friends.model;

option go_package = "work.kanto.friends/model;friendsmodel";
option java_multiple_files = true;
option java_package = "work.kanto.friends.model";
option swift_prefix = "Friends";

// チャット種別 (dm_, gm_)
enum ChatType {
  CHAT_TYPE_UNSPECIFIED = 0;
  CHAT_TYPE_DIRECT = 1; // 1:1 DM (dm_)
  CHAT_TYPE_GROUP = 2;  // グループチャット (gm_)
}

// メッセージ種別
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TEXT = 1;
  MESSAGE_TYPE_IMAGE = 2;
  MESSAGE_TYPE_SYSTEM = 3;
}

// アカウント認証種別
enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_ANONYMOUS = 1;
  ACCOUNT_TYPE_PERSISTENT = 2;
}

// ユーザーロール
enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_MEMBER = 1;
  USER_ROLE_MANAGER = 2;
  USER_ROLE_TENANT_ADMIN = 3;
  USER_ROLE_SERVICE_ADMIN = 4;
}

// E2EE 暗号化メッセージペイロード
message EncryptedPayload {
  string ciphertext = 1; // 暗号文 (Base64)
  string nonce = 2;      // AES-256-GCM Nonce / IV (Base64)
}
