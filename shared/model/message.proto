syntax = "proto3";

package friends.model;

import "google/protobuf/timestamp.proto";
import "common.proto";

option go_package = "work.kanto.friends/model;friendsmodel";
option java_multiple_files = true;
option java_package = "work.kanto.friends.model";
option swift_prefix = "Friends";

// 暗号化メッセージ (/tenants/{tenantId}/chats/{chatId}/messages/{messageId})
message Message {
  string message_id = 1; // ID 命名規約: m_xxx
  string tenant_id = 2;  // ID 命名規約: t_xxx
  string chat_id = 3;    // ID 命名規約: dm_xxx または gm_xxx
  string sender_id = 4;  // 送信者のユーザーID (u_xxx)
  string key_version = 5; // 使用鍵バージョン (例: v_1, v_2)
  EncryptedPayload encrypted_payload = 6;
  MessageType message_type = 7;
  string created_by = 8; // 送信者/作成者の userId (u_xxx)
  google.protobuf.Timestamp created_at = 9;
  string updated_by = 10; // 更新者の userId (u_xxx)
  google.protobuf.Timestamp updated_at = 11;
  map<string, int32> reaction_counts = 12; // reaction_type string (e.g. "thumbs_up") -> count
}

// リアクション種別
enum ReactionType {
  REACTION_TYPE_UNSPECIFIED = 0;
  REACTION_TYPE_THUMBS_UP = 1;   // 👍
  REACTION_TYPE_HEART = 2;       // ❤️
  REACTION_TYPE_OK = 3;          // 🆗
  REACTION_TYPE_SMILE = 4;       // 😊
  REACTION_TYPE_SURPRISED = 5;   // 😱
  REACTION_TYPE_SAD = 6;         // 😢
  REACTION_TYPE_THINKING = 7;    // 🤔
  REACTION_TYPE_LAUGH = 8;       // 🤣
}

// メッセージリアクション詳細 (/tenants/{tenantId}/chats/{chatId}/messages/{messageId}/reactions/{userId})
message MessageReaction {
  string reaction_id = 1;  // ID 命名規約: r_xxx
  string message_id = 2;   // ID 命名規約: m_xxx
  string chat_id = 3;      // ID 命名規約: dm_xxx または gm_xxx
  string tenant_id = 4;    // ID 命名規約: t_xxx
  string user_id = 5;      // ユーザーID (u_xxx)
  string user_name = 6;    // ユーザー表示名
  ReactionType reaction_type = 7;
  string created_by = 8;   // リアクション作成者の userId (u_xxx)
  google.protobuf.Timestamp created_at = 9;
  string updated_by = 10;  // リアクション更新者の userId (u_xxx)
  google.protobuf.Timestamp updated_at = 11;
}

